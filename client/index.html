<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rabbit Hole</title>
  <link rel="stylesheet" href="./style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <img src="./img/logo.svg" alt="Rabbit Hole logo" class="logo">

  <h1>Rabbit Hole</h1>

  <p>Search for any musician and see how they're connected.</p>

  <input
    id="artist-input"
    type="text"
    placeholder="Search for a person..."
    aria-label="Artist name"
  >

  <button id="search-button" type="button">Search</button>

  <div id="status" role="status" aria-live="polite">
    Search for an artist to see their connections.
  </div>

  <div id="graph" aria-label="Interactive graph of music connections"></div>

  <script type="module" src="./script.js"></script>

</body>
</html>
